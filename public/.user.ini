; Helpdesk attachments: up to 10 MB per file and 20 MB per message (TZ 3.1).
;
; Read by PHP-FPM / FastCGI / CGI (nginx + php-fpm, ispmanager "PHP as FastCGI"),
; re-read within 5 minutes of a change. Apache with PHP as a module reads the
; same values from .htaccess instead.
;
; Set a little above the app's own limits, so the app itself — not PHP — turns
; an oversized file away with a clear message. The web server in front must
; accept the same body size (nginx: client_max_body_size 25m).
upload_max_filesize = 12M
post_max_size = 25M

; 20 MB on a slow mobile connection takes several minutes to arrive.
max_input_time = 300
